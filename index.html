// Combines two id-keyed lists (players, rounds) without dropping entries that
// only exist on one side, so a concurrent write from another court/device
// can't erase something this client never knew about.
function mergeById(serverList, localList) {
  const localIds = new Set(localList.map((x) => x.id));
  const serverOnly = serverList.filter((x) => !localIds.has(x.id));
  return [...localList, ...serverOnly];
}

function mergeSessions(serverSessions, localSessions) {
  const localIds = new Set(localSessions.map((s) => s.id));
  const serverOnly = serverSessions.filter((s) => !localIds.has(s.id));
  const merged = localSessions.map((local) => {
    const server = serverSessions.find((s) => s.id === local.id);
    if (!server) return local;
    return {
      ...local,
      attendance: Array.from(new Set([...(server.attendance || []), ...(local.attendance || [])])),
      rounds: mergeById(server.rounds || [], local.rounds || []),
    };
  });
  return [...merged, ...serverOnly];
}

// Everyone gets an account, even if they never type an email: new visitors are
// signed in anonymously so their leagues are private to them from the start.
// Linking Google or an email/password later upgrades that same account in place,
// so nothing they've already created is lost.
const backend = {
  supportsAccounts: true,

  onAuth(cb) {
    return auth.onAuthStateChanged(function (u) {
      if (!u) {
        auth.signInAnonymously().catch(function (e) {
          console.error('Anonymous sign-in failed', e);
          cb(null);
        });
        return; // onAuthStateChanged fires again once the guest account exists
      }
      cb({ uid: u.uid, email: u.email, displayName: u.displayName, isAnonymous: u.isAnonymous });
    });
  },

  async signInGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    const current = auth.currentUser;
    if (current && current.isAnonymous) {
      try {
        await current.linkWithPopup(provider);
        return;
      } catch (e) {
        // The Google account already exists as its own user; sign into it instead.
        if (e.code === 'auth/credential-already-in-use' || e.code === 'auth/email-already-in-use') {
          await auth.signInWithPopup(provider);
          return;
        }
        throw e;
      }
    }
    await auth.signInWithPopup(provider);
  },

  async signUpEmail(email, pw) {
    const current = auth.currentUser;
    if (current && current.isAnonymous) {
      const cred = firebase.auth.EmailAuthProvider.credential(email, pw);
      await current.linkWithCredential(cred);
      return;
    }
    await auth.createUserWithEmailAndPassword(email, pw);
  },

  async signInEmail(email, pw) {
    await auth.signInWithEmailAndPassword(email, pw);
  },

  async signOut() {
    await auth.signOut(); // onAuth immediately creates a fresh guest account
  },

  subscribeLeagues(uid, cb) {
    return db
      .collection('leagues')
      .where('memberUids', 'array-contains', uid)
      .onSnapshot(
        function (snap) {
          cb(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
        },
        function (err) {
          console.error('League subscription failed', err);
          cb([]);
        }
      );
  },

  // A plain overwrite here would clobber sessions/players/membership that
  // another device wrote in between this client's last snapshot and now (e.g.
  // a teammate scoring a different court, or someone joining by code). Instead
  // this re-reads the current server doc inside a transaction and merges
  // sessions/rounds/players by id, so unrelated concurrent edits both survive.
  // memberUids/ownerUid/joinCode are intentionally left out of the payload -
  // they're only ever changed by createLeague/joinByCode, never by this path.
  saveLeague(lg) {
    const ref = db.collection('leagues').doc(lg.id);
    return db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      const server = snap.exists ? snap.data() : {};
      const payload = {
        name: lg.name,
        photo: lg.photo,
        defaultCourts: lg.defaultCourts,
        players: mergeById(server.players || [], lg.players || []),
        sessions: mergeSessions(server.sessions || [], lg.sessions || []),
      };
      tx.set(ref, payload, { merge: true });
    });
  },

  async createLeague(lg) {
    const copy = Object.assign({}, lg);
    delete copy.id;
    await db.collection('leagues').doc(lg.id).set(copy);
    await db.collection('joinCodes').doc(lg.joinCode).set({ leagueId: lg.id, ownerUid: lg.ownerUid });
  },

  async deleteLeague(lg) {
    await db.collection('leagues').doc(lg.id).delete();
    if (lg.joinCode) {
      try {
        await db.collection('joinCodes').doc(lg.joinCode).delete();
      } catch (e) {
        /* code entry may already be gone */
      }
    }
  },

  async joinByCode(code, uid) {
    const snap = await db.collection('joinCodes').doc(code).get();
    if (!snap.exists) return { ok: false, error: 'No league found with that code.' };
    const leagueId = snap.data().leagueId;
    // arrayUnion lets someone add only themselves without first reading the
    // league, which they are not yet allowed to do.
    await db.collection('leagues').doc(leagueId).update({
      memberUids: firebase.firestore.FieldValue.arrayUnion(uid),
    });
    return { ok: true, leagueId: leagueId };
  },

  async readLegacy() {
    try {
      const s = await db.collection('badmintonLeague').doc('data').get();
      return s.exists ? s.data() : null;
    } catch (e) {
      return null;
    }
  },
};

function uid(prefix = 'id') {
  return prefix + '_' + Math.random().toString(36).slice(2, 9);
}

// Ambiguous characters (0/O, 1/I) are left out so codes are easy to read aloud.
function genJoinCode() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 6; i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
  return out;
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

function fmtDDMMYYYY(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function titleMode(mode) {
  return mode === 'singles' ? 'Singles' : 'Doubles';

function defaultPlayers(n = 4) {
  return Array.from({ length: n }, (_, i) => ({ id: uid('p'), name: `Player ${i + 1}` }));

}

function partnerKey(team) {
  return [...team].sort().join('|');
}

function computePartnerCounts(sessions) {
  const counts = {};
  sessions.forEach((s) =>
    s.rounds.forEach((r) => {
      if (r.teamA.length === 2) {
        const k = partnerKey(r.teamA);
        counts[k] = (counts[k] || 0) + 1;
      }
      if (r.teamB.length === 2) {
        const k = partnerKey(r.teamB);
        counts[k] = (counts[k] || 0) + 1;
      }
    })
  );
  return counts;
}

function pickRound(mode, presentIds, currentRounds, partnerCounts, court = 1) {
  const need = mode === 'doubles' ? 4 : 2;
  if (presentIds.length < need) return null;

  const playedToday = {};
  presentIds.forEach((id) => (playedToday[id] = 0));
  currentRounds.forEach((r) => {
    [...r.teamA, ...r.teamB].forEach((id) => {
      if (playedToday[id] !== undefined) playedToday[id]++;
    });
  });

  const sorted = [...presentIds].sort((a, b) => {
    const d = playedToday[a] - playedToday[b];
    if (d !== 0) return d;
    return Math.random() - 0.5;
  });

  const playing = sorted.slice(0, need);
  const resting = sorted.slice(need);

  if (mode === 'singles') {
    const shuffled = [...playing].sort(() => Math.random() - 0.5);
    return { id: uid('r'), teamA: [shuffled[0]], teamB: [shuffled[1]], resting, scoreA: '', scoreB: '', court };
  }

  const [a, b, c, d] = playing;
  const splits = [
    [[a, b], [c, d]],
    [[a, c], [b, d]],
    [[a, d], [b, c]],
  ];
  const scored = splits.map(([t1, t2]) => {
    const score = (partnerCounts[partnerKey(t1)] || 0) + (partnerCounts[partnerKey(t2)] || 0);
    return { t1, t2, score };
  });
  const minScore = Math.min(...scored.map((s) => s.score));
  const bestOnes = scored.filter((s) => s.score === minScore);
  const chosen = bestOnes[Math.floor(Math.random() * bestOnes.length)];
  const flip = Math.random() < 0.5;
  const teamA = flip ? chosen.t2 : chosen.t1;
  const teamB = flip ? chosen.t1 : chosen.t2;
  return { id: uid('r'), teamA, teamB, resting, scoreA: '', scoreB: '', court };
}

function blankRound(mode, presentIds, court = 1) {
  return { id: uid('r'), teamA: [], teamB: [], resting: [...presentIds], scoreA: '', scoreB: '', court };
}

function computeStandings(players, sessions) {
  const stats = {};
  players.forEach((p) => {
    stats[p.id] = { id: p.id, name: p.name, played: 0, won: 0, lost: 0, pf: 0, pa: 0 };
  });
  sessions.forEach((s) => {
    if (!s) return;
    s.rounds.forEach((r) => {
      const a = Number(r.scoreA),
        b = Number(r.scoreB);
      if (r.scoreA === '' || r.scoreB === '' || isNaN(a) || isNaN(b) || a === b) return;
      const aWins = a > b;
      r.teamA.forEach((id) => {
        if (!stats[id]) return;
        stats[id].played++;
        stats[id].pf += a;
        stats[id].pa += b;
        if (aWins) stats[id].won++;
        else stats[id].lost++;
      });
      r.teamB.forEach((id) => {
        if (!stats[id]) return;
        stats[id].played++;
        stats[id].pf += b;
        stats[id].pa += a;
        if (!aWins) stats[id].won++;
        else stats[id].lost++;
      });
    });
  });
  return Object.values(stats).sort((x, y) => {
    if (y.won !== x.won) return y.won - x.won;
    const diffX = x.pf - x.pa,
      diffY = y.pf - y.pa;
    if (diffY !== diffX) return diffY - diffX;
    return y.pf - x.pf;
  });
}

function computeTopDuo(players, sessions) {
  const byId = Object.fromEntries(players.map((p) => [p.id, p.name]));
  const duo = {};
  sessions.forEach((s) =>
    s.rounds.forEach((r) => {
      const a = Number(r.scoreA),
        b = Number(r.scoreB);
      if (r.scoreA === '' || r.scoreB === '' || isNaN(a) || isNaN(b) || a === b) return;
      [
        { team: r.teamA, win: a > b },
        { team: r.teamB, win: b > a },
      ].forEach(({ team, win }) => {
        if (team.length !== 2) return;
        const k = partnerKey(team);
        duo[k] = duo[k] || { team, played: 0, won: 0 };
        duo[k].played++;
        if (win) duo[k].won++;
      });
    })
  );
  const list = Object.values(duo)
    .filter((d) => d.played >= 2)
    .map((d) => ({ ...d, wr: d.won / d.played, names: d.team.map((id) => byId[id] || '?') }))
    .sort((x, y) => y.wr - x.wr || y.played - x.played);
  return list[0] || null;
}

// Downscales and crops an image to a small square JPEG so league photos stay
// far below the database's per-document size limit.
function fileToSquareDataUrl(file, size = 160) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode image'));
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const scale = Math.max(size / img.width, size / img.height);
          const w = img.width * scale;
          const h = img.height * scale;
          ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        } catch (e) {
          reject(e);
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

          <button onClick={() => photoInputRef.current && photoInputRef.current.click()} className="px-3 py-1.5 rounded-lg text-sm" style={{ background: TOKENS.surfaceAlt, color: TOKENS.text, border: `1px solid ${TOKENS.line}` }}>
            {draftLeague.photo ? 'Replace' : 'Upload'}

          {draftLeague.photo && (

              Remove

          <input ref={photoInputRef} type="file" accept="image/*" onChange={onPickPhoto} style={{ display: 'none' }} />
        </div>
      </div>

      <div style={{ marginBottom: 16 }}>
        <div style={{ color: TOKENS.textDim, fontSize: 13, marginBottom: 6 }}>Number of courts</div>
        <div className="flex items-center gap-3">
          <button onClick={() => setDraftLeague({ ...draftLeague, courts: Math.max(1, (draftLeague.courts || 1) - 1) })} className="px-2.5 py-1 rounded-lg font-semibold" style={{ background: TOKENS.surfaceAlt, color: TOKENS.text, border: `1px solid ${TOKENS.line}` }}>
            −
          </button>
          <span className="bt-mono" style={{ fontWeight: 700, minWidth: 20, textAlign: 'center' }}>
            {draftLeague.courts || 1}
          </span>
          <button onClick={() => setDraftLeague({ ...draftLeague, courts: (draftLeague.courts || 1) + 1 })} className="px-2.5 py-1 rounded-lg font-semibold" style={{ background: TOKENS.surfaceAlt, color: TOKENS.text, border: `1px solid ${TOKENS.line}` }}>
            +
          </button>
        </div>
      </div>

      <div style={{ marginBottom: 18 }}>
        <div style={{ color: TOKENS.textDim, fontSize: 13, marginBottom: 6 }}>Players</div>
        <div className="grid gap-2">
          {draftLeague.playerNames.map((n, idx) => (
            <div key={idx} className="flex items-center gap-2">
              <input
                value={n}
                onChange={(e) => {
                  const next = [...draftLeague.playerNames];
                  next[idx] = e.target.value;
                  setDraftLeague({ ...draftLeague, playerNames: next });
                }}
                placeholder={`Player ${idx + 1}`}
                style={{ flex: 1, background: TOKENS.surfaceAlt, border: `1px solid ${TOKENS.line}`, borderRadius: 8, padding: '6px 10px', color: TOKENS.text }}
              />
              {draftLeague.playerNames.length > 1 && (
                <button onClick={() => setDraftLeague({ ...draftLeague, playerNames: draftLeague.playerNames.filter((_, i) => i !== idx) })} className="p-2 -m-2" style={{ color: TOKENS.textDim }}>
                  <X size={15} />
                </button>
              )}
            </div>
          ))}
        </div>
        <button onClick={() => setDraftLeague({ ...draftLeague, playerNames: [...draftLeague.playerNames, ''] })} className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-semibold mt-2" style={{ background: TOKENS.surfaceAlt, border: `1px solid ${TOKENS.line}`, color: TOKENS.text }}>
          <Plus size={13} /> Add player
        </button>
      </div>

      <div className="flex items-center gap-2">
        <button onClick={onCreate} disabled={!(draftLeague.name || '').trim()} className="flex items-center gap-2 px-4 py-2 rounded-lg font-semibold" style={{ background: TOKENS.teal, color: '#0B0D10', opacity: (draftLeague.name || '').trim() ? 1 : 0.5 }}>
          <Check size={14} /> Create league
        </button>
        <button onClick={onCancel} className="px-4 py-2 rounded-lg" style={{ background: TOKENS.surfaceAlt, color: TOKENS.textDim, border: `1px solid ${TOKENS.line}` }}>
          Cancel
        </button>
      </div>
      <div style={{ color: TOKENS.textDim, fontSize: 12, marginTop: 12 }}>
        You'll be this league's Admin. Share its join code so teammates can score alongside you.
      </div>
    </div>
  );
}

function JoinBox({ joinCodeInput, setJoinCodeInput, joinMsg, onJoin }) {

function BadmintonTracker() {
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [leagues, setLeagues] = useState(null);
  const [activeLeagueId, setActiveLeagueId] = useState(null);
  const [tab, setTab] = useState('today');
  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [draftAttendance, setDraftAttendance] = useState(null);
  const [draftMode, setDraftMode] = useState('doubles');
  const [draftCourts, setDraftCourts] = useState(1);
  const [selectedCourt, setSelectedCourt] = useState(1);
  const [historyOpen, setHistoryOpen] = useState({});
  const [spinId, setSpinId] = useState(null);
  const [editingRoundId, setEditingRoundId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [standingsScope, setStandingsScope] = useState('alltime');
  const [viewerMode, setViewerMode] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [settingsTab, setSettingsTab] = useState('account');
  const [creatingLeague, setCreatingLeague] = useState(false);
  const [draftLeague, setDraftLeague] = useState(null);
  const [photoError, setPhotoError] = useState('');
  const [joinCodeInput, setJoinCodeInput] = useState('');
  const [joinMsg, setJoinMsg] = useState('');
  const [authEmail, setAuthEmail] = useState('');
  const [authPw, setAuthPw] = useState('');
  const [authMsg, setAuthMsg] = useState('');
  const [authBusy, setAuthBusy] = useState(false);
  const [legacyData, setLegacyData] = useState(null);
  const [copiedCode, setCopiedCode] = useState(false);

  const saveTimer = useRef(null);
  const dirtyRef = useRef(new Set());
  const photoInputRef = useRef(null);
  const draftPhotoInputRef = useRef(null);

  useEffect(() => {
    const unsub = backend.onAuth((u) => {
      setUser(u);
      setAuthReady(true);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!user) {
      setLeagues(null);
      return;
    }
    const unsub = backend.subscribeLeagues(user.uid, (list) => {
      const normalized = list.map(normalizeLeague);
      setLeagues((prev) => {
        if (!prev) return normalized;
        // Keep local copies of leagues with unsaved edits so in-flight typing
        // isn't clobbered by an echo of our own write coming back.
        return normalized.map((srv) => {
          if (dirtyRef.current.has(srv.id)) {
            const local = prev.find((p) => p.id === srv.id);
            return local || srv;
          }
          return srv;
        });
      });
    });
    return unsub;
  }, [user]);

  useEffect(() => {
    if (!leagues || dirtyRef.current.size === 0) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const ids = Array.from(dirtyRef.current);
      dirtyRef.current.clear();
      ids.forEach((id) => {
        const lg = leagues.find((l) => l.id === id);
        if (lg) Promise.resolve(backend.saveLeague(lg)).catch((e) => console.error('save failed', e));
      });
    }, 500);
  }, [leagues]);

  useEffect(() => {
    if (!leagues || !leagues.length) return;
    setActiveLeagueId((prev) => (prev && leagues.some((l) => l.id === prev) ? prev : leagues[0].id));
  }, [leagues]);

  useEffect(() => {
    if (!leagues) return;
    const lg = leagues.find((l) => l.id === activeLeagueId);
    if (!lg) return;
    if (lg.sessions.some((s) => s.date === selectedDate)) return;
    setDraftAttendance((prev) => {
      if (prev) return prev;
      const init = {};
      lg.players.forEach((p) => (init[p.id] = true));
      return init;
    });
  }, [leagues, activeLeagueId, selectedDate]);

  // Offer a one-time import if a document from the earlier version is still around.
  useEffect(() => {
    if (!user || !backend.readLegacy) return;
    Promise.resolve(backend.readLegacy())
      .then((d) => {
        if (d && (d.players || d.sessions)) setLegacyData(d);
      })
      .catch(() => {});
  }, [user]);

  function markDirty(id) {
    dirtyRef.current.add(id);
  }

  function patchLeague(leagueId, patch) {
    markDirty(leagueId);
    setLeagues((prev) => prev.map((l) => (l.id === leagueId ? { ...l, ...patch } : l)));
  }

  async function doCreateLeague(name, playerObjs, courts, photo) {
    const lg = makeLeague({ name, players: playerObjs, defaultCourts: courts, photo, ownerUid: user.uid });
    setLeagues((prev) => [...(prev || []), lg]);
    setActiveLeagueId(lg.id);
    setDraftCourts(courts);
    try {
      await backend.createLeague(lg);
    } catch (e) {
      console.error('create league failed', e);
    }
    return lg;
  }

  async function handleJoin() {
    setJoinMsg('');
    const code = joinCodeInput.trim().toUpperCase();
    if (!code) return;
    try {
      const res = await backend.joinByCode(code, user.uid);
      if (res.ok) {
        setJoinCodeInput('');
        setJoinMsg('Joined.');
      } else {
        setJoinMsg(res.error);
      }
    } catch (e) {
      setJoinMsg('Could not join with that code.');
    }
  }

  async function importLegacy() {
    if (!legacyData) return;
    const lg = await doCreateLeague(
      'Badminton Champions',
      legacyData.players && legacyData.players.length ? legacyData.players : defaultPlayers(7),
      1,
      null
    );
    if (legacyData.sessions && legacyData.sessions.length) {
      patchLeague(lg.id, { sessions: legacyData.sessions });
    }
    setLegacyData(null);
    setSettingsOpen(false);
    setTab('today');
  }

  if (!authReady || !leagues) {
    return (
      <div style={{ background: TOKENS.bg, color: TOKENS.textDim, minHeight: 300, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Inter, sans-serif' }}>
        <style>{BASE_CSS}</style>
        Loading…
      </div>
    );
  }

  const league = leagues.find((l) => l.id === activeLeagueId) || leagues[0] || null;

  async function onPickDraftPhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const dataUrl = await fileToSquareDataUrl(file);
      setDraftLeague((d) => ({ ...d, photo: dataUrl }));
    } catch (err) {
      setPhotoError("That image couldn't be processed.");
    }
  }

  function openCreatePanel() {
    setDraftLeague({ name: '', photo: null, courts: 1, playerNames: ['', '', '', ''] });
    setSettingsOpen(false);
    setCreatingLeague(true);
  }

  async function commitCreateLeague() {
    const names = draftLeague.playerNames.map((n) => n.trim()).filter(Boolean);
    const playerObjs = names.length ? names.map((n) => ({ id: uid('p'), name: n })) : defaultPlayers(4);
    await doCreateLeague(draftLeague.name.trim(), playerObjs, Math.max(1, draftLeague.courts || 1), draftLeague.photo);
    setCreatingLeague(false);
    setDraftLeague(null);
    setTab('today');
    setSelectedDate(todayISO());
    setDraftAttendance(null);
  }

  // ---- empty state: no leagues yet ---------------------------------------
  if (!league) {
    return (
      <div style={{ color: TOKENS.text, fontFamily: 'Inter, system-ui, sans-serif', maxWidth: 720, margin: '0 auto', padding: 20 }}>
        <style>{BASE_CSS}</style>
        <div className="flex items-center gap-2 mb-6">
          <ShuttleIcon size={32} style={{ color: TOKENS.gold }} />
          <h1 className="bt-display" style={{ fontSize: 'clamp(18px, 5.5vw, 28px)', fontWeight: 700, lineHeight: 1.15 }}>
            BADMINTON LEAGUE <span style={{ color: TOKENS.gold }}>SCOREBOARD</span>
          </h1>
        </div>
        <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 12, padding: 20 }}>
          <div style={{ fontWeight: 600, marginBottom: 6 }}>Welcome</div>
          <div style={{ color: TOKENS.textDim, fontSize: 14, marginBottom: 16 }}>
            Set up your own league to start tracking games, or join one a friend has already created.
          </div>
          <button onClick={openCreatePanel} className="flex items-center gap-2 px-4 py-2 rounded-lg font-semibold mb-5" style={{ background: TOKENS.teal, color: '#0B0D10' }}>
            <Plus size={15} /> Create a league
          </button>
          <div style={{ borderTop: `1px solid ${TOKENS.line}`, paddingTop: 16 }}>
            <div style={{ color: TOKENS.textDim, fontSize: 13, marginBottom: 8 }}>Have a join code?</div>
            <JoinBox joinCodeInput={joinCodeInput} setJoinCodeInput={setJoinCodeInput} joinMsg={joinMsg} onJoin={handleJoin} />
          </div>
          {legacyData && (
            <div style={{ borderTop: `1px solid ${TOKENS.line}`, paddingTop: 16, marginTop: 16 }}>
              <div style={{ color: TOKENS.textDim, fontSize: 13, marginBottom: 8 }}>Games from the earlier version of this app were found.</div>
              <button onClick={importLegacy} className="px-4 py-2 rounded-lg font-semibold" style={{ background: TOKENS.gold, color: '#0B0D10' }}>
                Import as "Badminton Champions"
              </button>
            </div>
          )}
        </div>
        {creatingLeague && draftLeague && (
          <CreateLeaguePanel
            draftLeague={draftLeague}
            setDraftLeague={setDraftLeague}
            onCancel={() => {
              setCreatingLeague(false);
              setDraftLeague(null);
            }}
            onCreate={commitCreateLeague}
            photoInputRef={draftPhotoInputRef}
            onPickPhoto={onPickDraftPhoto}
          />
        )}
      </div>
    );
  }

  const players = league.players;
  const sessions = league.sessions;
  const playersById = Object.fromEntries(players.map((p) => [p.id, p.name]));
  const activeSession = sessions.find((s) => s.date === selectedDate);
  const partnerCounts = computePartnerCounts(sessions);
  const standings = computeStandings(players, sessions);
  const topDuo = computeTopDuo(players, sessions);

  // The person who created a league is its Admin. Everyone else who joins can
  // run today's and future game days but cannot delete anything or edit history.
  const isOwner = !!user && league.ownerUid === user.uid;
  const adminMode = isOwner && !viewerMode;
  const isPastDate = selectedDate < todayISO();
  const canEdit = adminMode || !isPastDate;
  const canDelete = adminMode;

  // Deleting a league is owner-only, full stop - this mirrors firestore.rules
  // exactly so the button never promises something the backend will reject.
  // (An earlier version also let any member delete a league within 24h of its
  // creation, but that window can't be verified server-side since createdAt is
  // a plain string, not a Firestore timestamp - so it's gone from both sides.)
  function canDeleteLeague(lg) {
    return !!lg && !!user && lg.ownerUid === user.uid;
  }

  function updateSessions(fn) {
    markDirty(league.id);
    setLeagues((prev) => prev.map((l) => (l.id === league.id ? { ...l, sessions: fn(l.sessions) } : l)));
  }

  function updatePlayers(fn) {
    markDirty(league.id);
    setLeagues((prev) => prev.map((l) => (l.id === league.id ? { ...l, players: fn(l.players) } : l)));
  }

  function startSession() {
    const present = players.filter((p) => draftAttendance && draftAttendance[p.id]).map((p) => p.id);
    updateSessions((prev) => [...prev, { id: uid('s'), date: selectedDate, mode: draftMode, attendance: present, rounds: [], courts: draftCourts }]);
    setSelectedCourt(1);
  }

  function updateSession(patch) {
    updateSessions((prev) => prev.map((s) => (s.id === activeSession.id ? { ...s, ...patch } : s)));
  }

  function addCourt() {
    const next = (activeSession.courts || 1) + 1;
    updateSession({ courts: next });
    setSelectedCourt(next);
  }

  function addRound() {
    const court = Math.min(selectedCourt, activeSession.courts || 1);
    const round = pickRound(activeSession.mode, activeSession.attendance, activeSession.rounds, partnerCounts, court);
    if (!round) return;
    updateSession({ rounds: [...activeSession.rounds, round] });
  }

  function addManualRound() {
    const court = Math.min(selectedCourt, activeSession.courts || 1);
    const round = blankRound(activeSession.mode, activeSession.attendance, court);
    updateSession({ rounds: [...activeSession.rounds, round] });
    openEditTeams(round);
  }

  function openEditTeams(round) {
    setEditingRoundId(round.id);
    const need = activeSession.mode === 'doubles' ? 2 : 1;
    setEditDraft({
      a: [...round.teamA, ...Array(Math.max(0, need - round.teamA.length)).fill('')],
      b: [...round.teamB, ...Array(Math.max(0, need - round.teamB.length)).fill('')],
    });
  }

  function cancelEditTeams(round) {
    const wasBlank = round.teamA.length === 0 && round.teamB.length === 0;
    setEditingRoundId(null);
    setEditDraft(null);
    if (wasBlank) removeRound(round.id);
  }

  function saveEditTeams(roundId) {
    const a = editDraft.a.filter(Boolean);
    const b = editDraft.b.filter(Boolean);
    const need = activeSession.mode === 'doubles' ? 2 : 1;
    if (a.length !== need || b.length !== need) return;
    const chosen = new Set([...a, ...b]);
    const resting = activeSession.attendance.filter((id) => !chosen.has(id));
    updateSession({ rounds: activeSession.rounds.map((r) => (r.id === roundId ? { ...r, teamA: a, teamB: b, resting } : r)) });
    setEditingRoundId(null);
    setEditDraft(null);
  }

  function swapRoundResult(roundId) {
    updateSession({
      rounds: activeSession.rounds.map((r) => (r.id === roundId ? { ...r, teamA: r.teamB, teamB: r.teamA, scoreA: r.scoreB, scoreB: r.scoreA } : r)),
    });
  }

  function reshuffleRound(roundId) {
    const idx = activeSession.rounds.findIndex((r) => r.id === roundId);
    if (idx === -1) return;
    setSpinId(roundId);
    setTimeout(() => setSpinId(null), 400);
    const priorRounds = activeSession.rounds.slice(0, idx);
    const existingCourt = activeSession.rounds[idx].court || 1;
    const fresh = pickRound(activeSession.mode, activeSession.attendance, priorRounds, partnerCounts, existingCourt);
    if (!fresh) return;
    const newRounds = [...activeSession.rounds];
    newRounds[idx] = { ...fresh, id: roundId, scoreA: newRounds[idx].scoreA, scoreB: newRounds[idx].scoreB };
    updateSession({ rounds: newRounds });
  }

  function removeRound(roundId) {
    updateSession({ rounds: activeSession.rounds.filter((r) => r.id !== roundId) });
  }

  function setScore(roundId, side, val) {
    val = val.replace(/[^0-9]/g, '').slice(0, 2);
    updateSession({ rounds: activeSession.rounds.map((r) => (r.id === roundId ? { ...r, [side]: val } : r)) });
  }

  function deleteSession(id) {
    updateSessions((prev) => prev.filter((s) => s.id !== id));
  }

  function renamePlayer(id, name) {
    updatePlayers((prev) => prev.map((p) => (p.id === id ? { ...p, name } : p)));
  }

  function addPlayer() {
    updatePlayers((prev) => [...prev, { id: uid('p'), name: `Player ${prev.length + 1}` }]);
  }

  function addPlayerToSession() {
    const fresh = { id: uid('p'), name: `Player ${players.length + 1}` };
    markDirty(league.id);
    setLeagues((prev) =>
      prev.map((l) =>
        l.id === league.id
          ? {
              ...l,
              players: [...l.players, fresh],
              sessions: l.sessions.map((s) => (s.id === activeSession.id ? { ...s, attendance: [...s.attendance, fresh.id] } : s)),
            }
          : l
      )
    );
  }

  function removePlayer(id) {
    if (sessions.some((s) => s.attendance.includes(id))) {
      alert("This player has match history, so they can't be removed — you can rename them instead.");
      return;
    }
    updatePlayers((prev) => prev.filter((p) => p.id !== id));
  }

  async function onPickLeaguePhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setPhotoError('');
    try {
      const dataUrl = await fileToSquareDataUrl(file);
      patchLeague(league.id, { photo: dataUrl });
    } catch (err) {
      setPhotoError("That image couldn't be processed. Try a different file.");
    }
  }

  async function handleDeleteLeague(lg) {
    if (!window.confirm(`Delete the league "${lg.name}" and all of its games? This can't be undone.`)) return;
    const remaining = leagues.filter((l) => l.id !== lg.id);
    setLeagues(remaining);
    setActiveLeagueId(remaining.length ? remaining[0].id : null);
    try {
      await backend.deleteLeague(lg);
    } catch (e) {
      console.error('delete failed', e);
    }
  }

  const queueIds = activeSession
    ? activeSession.attendance.filter((id) => {
        const busy = activeSession.rounds.some((r) => {
          const ra = Number(r.scoreA),
            rb = Number(r.scoreB);
          const rDecided = r.scoreA !== '' && r.scoreB !== '' && !isNaN(ra) && !isNaN(rb) && ra !== rb;
          return !rDecided && (r.teamA.includes(id) || r.teamB.includes(id));
        });
        return !busy;
      })
    : [];

  const pastSessions = [...sessions].sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div style={{ color: TOKENS.text, fontFamily: 'Inter, system-ui, sans-serif', maxWidth: 1400, margin: '0 auto', padding: 20 }}>
      <style>{BASE_CSS}</style>

      {/* Header */}
      <div style={{ background: TOKENS.surface, borderRadius: 14, padding: '14px 18px', marginBottom: 14 }}>
        <div className="flex items-start justify-between gap-3">
          <div
            className="flex items-center gap-2"
            style={{ minWidth: 0, flex: 1, cursor: 'pointer' }}
            onClick={() => {
              setSettingsOpen(false);
              setCreatingLeague(false);
              setTab('today');
            }}
            title="Back to Live Game"
          >
            <ShuttleIcon size={32} style={{ color: TOKENS.gold, flexShrink: 0 }} />
            <div style={{ minWidth: 0 }}>
              <h1 className="bt-display" style={{ fontSize: 'clamp(18px, 5.5vw, 28px)', fontWeight: 700, color: TOKENS.text, lineHeight: 1.15 }}>
                BADMINTON LEAGUE <span style={{ color: TOKENS.gold }}>SCOREBOARD</span>
              </h1>
            </div>
          </div>
          <button
            onClick={() => {
              setCreatingLeague(false);
              setSettingsOpen((v) => !v);
            }}
            className="flex items-center justify-center rounded-full"
            style={{
              background: settingsOpen ? TOKENS.gold : TOKENS.surfaceAlt,
              color: settingsOpen ? '#0B0D10' : TOKENS.textDim,
              border: `1px solid ${settingsOpen ? TOKENS.gold : TOKENS.line}`,
              flexShrink: 0,
              width: 36,
              height: 36,
            }}
            title="Settings"
          >
            <GearIcon size={17} />
          </button>
        </div>
      </div>

      {/* League bar */}
      <div className="flex items-center gap-3 flex-wrap" style={{ marginBottom: 16 }}>
        <div className="bt-photo" onClick={() => photoInputRef.current && photoInputRef.current.click()} title="Change league photo">
          <LeagueAvatar photo={league.photo} size={46} />
          <div className="bt-photo-overlay">
            <span title={league.photo ? 'Replace' : 'Upload'}>📷</span>
            {league.photo && (
              <span

                                    readOnly={!canEdit}
                                    placeholder="0"
                                    style={{ flex: 1, minWidth: 0, width: '100%', textAlign: 'center', fontSize: 22, fontWeight: 700, background: '#2FA8A02E', border: `1px solid ${TOKENS.tealDim}`, borderRadius: 10, color: TOKENS.text, padding: '10px 0', cursor: canEdit ? 'text' : 'default' }}
                                  />
                                  <div style={{ minWidth: 24 }} />
                                  <input
                                    className="bt-scorebox bt-mono"
                                    type="text"
                                    inputMode="numeric"
                                    value={r.scoreB}
                                    onChange={(e) => setScore(r.id, 'scoreB', e.target.value)}
                                    readOnly={!canEdit}
                                    placeholder="0"
                                    style={{ flex: 1, minWidth: 0, width: '100%', textAlign: 'center', fontSize: 22, fontWeight: 700, background: '#F4B9422E', border: `1px solid ${TOKENS.gold}`, borderRadius: 10, color: TOKENS.text, padding: '10px 0', cursor: canEdit ? 'text' : 'default' }}
                                  />
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {queueIds.length > 0 && (
                    <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 12, padding: 14, marginBottom: 16, maxWidth: 620 }}>
                      <div className="flex items-center gap-2 mb-2">
                        <Users size={15} style={{ color: TOKENS.textDim }} />
                        <span className="bt-display" style={{ fontSize: 13, fontWeight: 700, color: TOKENS.textDim, letterSpacing: '0.06em' }}>
                          {adminMode ? 'QUEUE' : 'PLAYERS PRESENT'} ({queueIds.length})
                        </span>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        {queueIds.map((id, qi) => (
                          <span key={id} className="bt-mono" style={{ background: TOKENS.surfaceAlt, color: TOKENS.text, borderRadius: 999, padding: '4px 10px', fontSize: 13, border: `1px solid ${TOKENS.line}` }}>
                            {qi + 1}. {playersById[id]}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  {canEdit && (
                    <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 12, padding: 14, marginBottom: 16, maxWidth: 620 }}>
                      <div className="flex items-center gap-2 mb-3">
                        <Pencil size={14} style={{ color: TOKENS.textDim }} />
                        <span className="bt-display" style={{ fontSize: 13, fontWeight: 700, color: TOKENS.textDim, letterSpacing: '0.06em' }}>
                          PLAYER NAMES
                        </span>
                      </div>
                      <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))' }}>
                        {activeSession.attendance.map((id) => (
                          <input
                            key={id}
                            value={playersById[id] || ''}
                            onChange={(e) => renamePlayer(id, e.target.value)}
                            style={{ background: TOKENS.surfaceAlt, border: `1px solid ${TOKENS.line}`, borderRadius: 8, padding: '6px 10px', color: TOKENS.text, width: '100%' }}
                          />
                        ))}
                      </div>
                      <button onClick={addPlayerToSession} className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-semibold mt-3" style={{ background: TOKENS.surfaceAlt, border: `1px solid ${TOKENS.line}`, color: TOKENS.text }}>
                        <Plus size={13} /> Add player
                      </button>
                    </div>
                  )}

                  {canEdit && (activeSession.courts || 1) > 1 && (
                    <div className="flex items-center gap-2 mb-2 flex-wrap">
                      <span style={{ color: TOKENS.textDim, fontSize: 13 }}>New game for:</span>
                      {Array.from({ length: activeSession.courts || 1 }, (_, i) => i + 1).map((cnum) => (
                        <Chip key={cnum} active={selectedCourt === cnum} onClick={() => setSelectedCourt(cnum)} color={TOKENS.gold}>
                          Court {cnum}
                        </Chip>
                      ))}
                    </div>
                  )}

                  {canEdit && (
                    <div className="flex gap-2 flex-wrap">
                      <button onClick={addRound} className="flex items-center gap-2 px-4 py-2 rounded-lg font-semibold" style={{ background: TOKENS.tealDim, color: TOKENS.text, border: `1px solid ${TOKENS.teal}` }}>
                        <Shuffle size={16} /> Shuffle next game
                      </button>
                      <button onClick={addManualRound} className="flex items-center gap-2 px-4 py-2 rounded-lg font-semibold" style={{ background: TOKENS.surfaceAlt, color: TOKENS.text, border: `1px solid ${TOKENS.line}` }}>
                        <Pencil size={16} /> Pick players manually
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {tab === 'standings' && (
            <div>
              <div className="flex items-center gap-2 mb-2 flex-wrap">
                <Chip active={standingsScope === 'session'} onClick={() => setStandingsScope('session')}>
                  This game day
                </Chip>
                <Chip active={standingsScope === 'alltime'} onClick={() => setStandingsScope('alltime')}>
                  Overall
                </Chip>
              </div>
              {standingsScope === 'session' && (
                <div className="bt-mono" style={{ color: TOKENS.textDim, fontSize: 13, marginBottom: 12 }}>
                  {fmtDDMMYYYY(selectedDate)}
                </div>
              )}
              {standingsScope === 'session' && !activeSession && (
                <div style={{ color: TOKENS.textDim, marginBottom: 12 }}>
                  No session started for {fmtDate(selectedDate)} yet — pick a date on the Live Game tab, or switch to Overall.
                </div>
              )}
              {topDuo && standingsScope === 'alltime' && (
                <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 12, padding: 14, marginBottom: 16, maxWidth: 620 }}>
                  <div className="flex items-center gap-2" style={{ color: TOKENS.gold, fontWeight: 700 }}>
                    <Trophy size={16} /> Top duo
                  </div>
                  <div style={{ marginTop: 4 }}>
                    {topDuo.names.join(' & ')} — {Math.round(topDuo.wr * 100)}% win rate over {topDuo.played} games together
                  </div>
                </div>
              )}
              {(standingsScope === 'alltime' || activeSession) && (
                <div style={{ overflowX: 'auto', maxWidth: 820 }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                    <thead>
                      <tr style={{ color: TOKENS.textDim, fontSize: 12, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                        <th style={{ textAlign: 'left', padding: '6px 8px' }}>Rank</th>
                        <th style={{ textAlign: 'left', padding: '6px 8px' }}>Player</th>
                        <th style={{ textAlign: 'right', padding: '6px 8px' }}>Wins</th>
                        <th style={{ textAlign: 'right', padding: '6px 8px' }}>Games Played</th>
                        <th style={{ textAlign: 'right', padding: '6px 8px' }}>Win%</th>
                        <th style={{ textAlign: 'right', padding: '6px 8px' }}>Total Score</th>
                      </tr>
                    </thead>
                    <tbody>
                      {(standingsScope === 'alltime' ? standings : computeStandings(players, [activeSession])).map((s, i) => (
                        <tr key={s.id} style={{ borderTop: `1px solid ${TOKENS.line}` }}>
                          <td className="bt-mono" style={{ padding: '8px', fontWeight: 700, color: i < 3 ? TOKENS.gold : TOKENS.textDim }}>
                            {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}
                          </td>
                          <td style={{ padding: '8px', fontWeight: 600 }}>{s.name}</td>
                          <td className="bt-mono" style={{ textAlign: 'right', padding: '8px', color: TOKENS.win, fontWeight: 700 }}>
                            {s.won}
                          </td>
                          <td className="bt-mono" style={{ textAlign: 'right', padding: '8px' }}>
                            {s.played}
                          </td>
                          <td className="bt-mono" style={{ textAlign: 'right', padding: '8px' }}>
                            {s.played ? Math.round((s.won / s.played) * 100) + '%' : '—'}
                          </td>
                          <td className="bt-mono" style={{ textAlign: 'right', padding: '8px', color: TOKENS.gold, fontWeight: 700 }}>
                            {s.pf}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {tab === 'history' && (
            <div className="grid gap-3" style={{ maxWidth: 640, marginLeft: 0 }}>
              {pastSessions.length === 0 && <div style={{ color: TOKENS.textDim }}>No sessions logged yet.</div>}
              {pastSessions.map((s) => {
                const open = !!historyOpen[s.id];
                return (
                  <div key={s.id} style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 12, padding: 14 }}>
                    <button onClick={() => setHistoryOpen((prev) => ({ ...prev, [s.id]: !prev[s.id] }))} className="flex items-center justify-between w-full" style={{ color: TOKENS.text }}>
                      <span style={{ fontWeight: 600 }}>
                        {fmtDate(s.date)} · {titleMode(s.mode)} · {s.rounds.length} games
                      </span>
                      {open ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                    </button>
                    {open && (
                      <div className="mt-3 grid gap-2">
                        {s.rounds.map((r, i) => {
                          const ha = Number(r.scoreA),
                            hb = Number(r.scoreB);
                          const hDecided = r.scoreA !== '' && r.scoreB !== '' && !isNaN(ha) && !isNaN(hb) && ha !== hb;
                          const hAWins = hDecided && ha > hb;
                          const winners = hDecided ? (hAWins ? r.teamA : r.teamB) : r.teamA;
                          const losers = hDecided ? (hAWins ? r.teamB : r.teamA) : r.teamB;
                          const winScore = hDecided ? (hAWins ? r.scoreA : r.scoreB) : r.scoreA;
                          const loseScore = hDecided ? (hAWins ? r.scoreB : r.scoreA) : r.scoreB;
                          return (
                            <div key={r.id} style={{ fontSize: 14, color: TOKENS.textDim }}>
                              Game {i + 1}
                              {(s.courts || 1) > 1 ? ` (Court ${r.court || 1})` : ''}:{' '}
                              {hDecided && <Check size={13} style={{ color: TOKENS.win, display: 'inline-block', verticalAlign: 'middle', marginRight: 3 }} />}
                              <span style={{ fontWeight: hDecided ? 700 : 400, color: hDecided ? TOKENS.win : TOKENS.text }}>
                                {winners.map((id) => playersById[id]).join(' & ')}
                              </span>
                              <span style={{ margin: '0 6px' }}>vs</span>
                              {losers.map((id) => playersById[id]).join(' & ')}
                              <span className="bt-mono" style={{ color: TOKENS.text, marginLeft: 10 }}>
                                {winScore || 0}–{loseScore || 0}
                              </span>
                            </div>
                          );
                        })}
                        {canDelete && (
                          <button onClick={() => deleteSession(s.id)} className="flex items-center gap-1 text-sm mt-1" style={{ color: TOKENS.loss }}>
                            <Trash2 size={14} /> Delete session
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BadmintonTracker />);
</script>

  // Compile with Babel's CLASSIC JSX runtime (React.createElement). The default

  var appSource = document.getElementById('app-source').textContent;
  var compiled = Babel.transform(appSource, { presets: [['react', { runtime: 'classic' }]] }).code;
  var s = document.createElement('script');
  s.text = compiled;
